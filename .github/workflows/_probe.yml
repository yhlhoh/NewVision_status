name: Probe Token
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/_probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then echo "GH_PAT_EMPTY"; exit 1; fi
          echo "GH_PAT_LEN=${#GH_PAT}"
          echo "GH_PAT_PREFIX=${GH_PAT:0:4}"
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" https://api.github.com/user)
          echo "GH_PAT_USER_HTTP=$code"
          head -c 200 /tmp/me.json; echo
          code2=$(curl -s -o /tmp/repo.json -w '%{http_code}' -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" https://api.github.com/repos/yhlhoh/NewVision_status)
          echo "GH_PAT_REPO_HTTP=$code2"
          python3 -c "import json;d=json.load(open('/tmp/repo.json'));print('GH_PAT_PERM',d.get('permissions'))" 2>/dev/null || true